<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Security gates across five independent GitLab repositories</title>
<desc id="desc">Five separately owned repositories: Terraform modules, infrastructure, GitOps, Helm charts and JSAPP microservices. Repository-specific CI verification with Trivy, Terraform, kubeconform, Gitleaks, Semgrep, Hadolint and a CycloneDX SBOM. Job enforcement varies: blocking Gitleaks and SBOM, advisory Semgrep and Hadolint; Terraform, GitOps and Helm have domain-specific controls. A separate read-only monitor reads origin/main and reports version updates for review, never auto-upgrades.</desc>
